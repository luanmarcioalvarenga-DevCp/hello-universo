<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azul — um pequeno universo de corações</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header><a class="brand" href="#inicio">azul<span>✦</span></a><span class="edition">UM EXPERIMENTO DE AFETO</span></header>
  <main id="inicio">
    <div class="eyebrow"><span></span> UM POUCO DE LEVEZA, SÓ PARA VOCÊ</div>
    <h1>Deixe o carinho<br>ganhar <em>espaço.</em></h1>
    <p>Pequenos corações. Infinitas possibilidades.<br>Toque em qualquer lugar e espalhe um pouco de azul.</p>
    <button id="burst" class="primary">Espalhar carinho <span aria-hidden="true">♡</span></button>
    <div class="hint">CLIQUE, TOQUE OU SIMPLESMENTE CONTEMPLE</div>
  </main>
  <footer><span>FEITO DE CÓDIGO & CARINHO</span><div class="controls"><button id="pause" aria-pressed="false">Pausar movimento</button><button id="clear">Limpar explosões</button></div><span class="signature">140 pequenos motivos para sorrir.</span></footer>
</body>
</html>
